<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="100%" height="100%" style="font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <style>
      .text-title { fill: #0f172a; font-weight: 800; }
      .box-rule { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
      .rule-title { fill: #0f172a; font-weight: 700; font-size: 13px; }
      .rule-desc { fill: #475569; font-size: 11px; }

      @media (prefers-color-scheme: dark) {
        .text-title { fill: #f8fafc; }
        .box-rule { fill: #1e293b; stroke: #334155; }
        .rule-title { fill: #f8fafc; }
        .rule-desc { fill: #cbd5e1; }
      }
    </style>
    <marker id="arr-std" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
  </defs>

  <text x="440" y="32" text-anchor="middle" class="text-title" font-size="18">Policy Rule Evaluation Precedence</text>

  <!-- Step 1: Hard Denies -->
  <rect x="40" y="60" width="800" height="42" rx="6" class="box-rule" stroke="#ef4444" stroke-width="2" />
  <rect x="52" y="70" width="120" height="22" rx="4" fill="#dc2626" />
  <text x="112" y="85" text-anchor="middle" fill="#ffffff" font-weight="800" font-size="10">1. HARD DENIES</text>
  <text x="185" y="85" class="rule-title">Immutable System Vetoes</text>
  <text x="820" y="85" text-anchor="end" class="rule-desc">rm -rf /, .git/hooks, /dev, /sys, curl..|bash → DENY</text>

  <path d="M 440 102 L 440 118" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#arr-std)" />

  <!-- Step 2: Configurable Denies -->
  <rect x="40" y="120" width="800" height="42" rx="6" class="box-rule" stroke="#f87171" />
  <rect x="52" y="130" width="120" height="22" rx="4" fill="#b91c1c" />
  <text x="112" y="145" text-anchor="middle" fill="#ffffff" font-weight="800" font-size="10">2. CONFIG DENIES</text>
  <text x="185" y="145" class="rule-title">User Configured Deny Rules</text>
  <text x="820" y="145" text-anchor="end" class="rule-desc">Explicit deny rules in Starlark / JSON → DENY</text>

  <path d="M 440 162 L 440 178" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#arr-std)" />

  <!-- Step 3: Prompts -->
  <rect x="40" y="180" width="800" height="42" rx="6" class="box-rule" stroke="#f59e0b" />
  <rect x="52" y="190" width="120" height="22" rx="4" fill="#d97706" />
  <text x="112" y="205" text-anchor="middle" fill="#ffffff" font-weight="800" font-size="10">3. PROMPTS</text>
  <text x="185" y="205" class="rule-title">Review Prompt Rules</text>
  <text x="820" y="205" text-anchor="end" class="rule-desc">git checkout -b &lt;branch&gt;, mutating commands → PROMPT</text>

  <path d="M 440 222 L 440 238" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#arr-std)" />

  <!-- Step 4: Fast Allows -->
  <rect x="40" y="240" width="800" height="42" rx="6" class="box-rule" stroke="#10b981" />
  <rect x="52" y="250" width="120" height="22" rx="4" fill="#059669" />
  <text x="112" y="265" text-anchor="middle" fill="#ffffff" font-weight="800" font-size="10">4. FAST ALLOWS</text>
  <text x="185" y="265" class="rule-title">Static Fast-Path Allow Rules</text>
  <text x="820" y="265" text-anchor="end" class="rule-desc">git status, git diff, cargo check, npm test → ALLOW</text>
</svg>
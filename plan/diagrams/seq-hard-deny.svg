<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="100%" height="100%" style="font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <style>
      .text-title { fill: #0f172a; font-weight: 800; }
      .text-actor { fill: #0f172a; font-weight: 700; }
      .actor-box { fill: #f1f5f9; stroke: #0284c7; stroke-width: 1.5; }
      .lifeline { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 4,4; }
      .msg-line-red { stroke: #ef4444; stroke-width: 2; }
      .msg-line-std { stroke: #0284c7; stroke-width: 1.8; }
      .msg-text-red { fill: #b91c1c; font-size: 11px; font-weight: 700; }
      .msg-text-std { fill: #334155; font-size: 11px; font-weight: 600; }

      @media (prefers-color-scheme: dark) {
        .text-title { fill: #f8fafc; }
        .text-actor { fill: #f8fafc; }
        .actor-box { fill: #1e293b; stroke: #38bdf8; }
        .lifeline { stroke: #334155; }
        .msg-line-red { stroke: #f87171; }
        .msg-line-std { stroke: #38bdf8; }
        .msg-text-red { fill: #fca5a5; }
        .msg-text-std { fill: #cbd5e1; }
      }
    </style>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
    <marker id="arr-std" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
  </defs>

  <text x="440" y="32" text-anchor="middle" class="text-title" font-size="18">Sequence 2.2.2: Tier 1 Hard-Deny Block Sequence</text>

  <line x1="80" y1="80" x2="80" y2="240" class="lifeline" />
  <rect x="25" y="50" width="110" height="30" rx="6" class="actor-box" stroke="#0284c7" />
  <text x="80" y="70" text-anchor="middle" class="text-actor" font-size="11">Tool Call</text>

  <line x1="280" y1="80" x2="280" y2="240" class="lifeline" />
  <rect x="225" y="50" width="110" height="30" rx="6" class="actor-box" />
  <text x="280" y="70" text-anchor="middle" class="text-actor" font-size="11">SafetyGate</text>

  <line x1="480" y1="80" x2="480" y2="240" class="lifeline" />
  <rect x="425" y="50" width="110" height="30" rx="6" class="actor-box" />
  <text x="480" y="70" text-anchor="middle" class="text-actor" font-size="11">BashAST</text>

  <line x1="680" y1="80" x2="680" y2="240" class="lifeline" />
  <rect x="625" y="50" width="110" height="30" rx="6" class="actor-box" />
  <text x="680" y="70" text-anchor="middle" class="text-actor" font-size="11">PolicyEngine</text>

  <path d="M 80 110 L 280 110" fill="none" class="msg-line-std" marker-end="url(#arr-std)" />
  <text x="180" y="103" text-anchor="middle" class="msg-text-std">1. Shell Call (rm -rf /)</text>

  <path d="M 280 140 L 480 140" fill="none" class="msg-line-std" marker-end="url(#arr-std)" />
  <text x="380" y="133" text-anchor="middle" class="msg-text-std">2. Decompose AST</text>

  <path d="M 280 170 L 680 170" fill="none" class="msg-line-std" marker-end="url(#arr-std)" />
  <text x="480" y="163" text-anchor="middle" class="msg-text-std">3. Evaluate Rules</text>

  <path d="M 680 200 L 280 200" fill="none" class="msg-line-red" marker-end="url(#arr-red)" />
  <text x="480" y="193" text-anchor="middle" class="msg-text-red">Hard Veto Matched (rm -rf /) ✗</text>

  <path d="M 280 220 L 80 220" fill="none" class="msg-line-red" marker-end="url(#arr-red)" />
  <text x="180" y="213" text-anchor="middle" class="msg-text-red">4. Immediate Fail-Closed Block Error</text>
</svg>
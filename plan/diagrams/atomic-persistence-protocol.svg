<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="100%" height="100%" style="font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <style>
      .text-title { fill: #0f172a; font-weight: 800; }
      .box-step { fill: #f8fafc; stroke: #0284c7; stroke-width: 1.5; }
      .step-num { fill: #0284c7; font-weight: 800; font-size: 11px; }
      .step-text { fill: #0f172a; font-weight: 700; font-size: 12px; }

      @media (prefers-color-scheme: dark) {
        .text-title { fill: #f8fafc; }
        .box-step { fill: #1e293b; stroke: #38bdf8; }
        .step-num { fill: #38bdf8; }
        .step-text { fill: #f8fafc; }
      }
    </style>
    <marker id="arr-std" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
  </defs>

  <text x="440" y="28" text-anchor="middle" class="text-title" font-size="17">Concurrent Atomic Persistence Protocol</text>

  <!-- Step 1 -->
  <rect x="140" y="45" width="600" height="34" rx="6" class="box-step" />
  <rect x="152" y="52" width="24" height="20" rx="4" fill="#0284c7" />
  <text x="164" y="66" text-anchor="middle" fill="#ffffff" font-weight="800" font-size="10">1</text>
  <text x="185" y="66" class="step-text">Acquire Sibling Lockfile (.pi/sandbox-rules.json.lock)</text>

  <path d="M 440 79 L 440 93" fill="none" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arr-std)" />

  <!-- Step 2 -->
  <rect x="140" y="95" width="600" height="34" rx="6" class="box-step" />
  <rect x="152" y="102" width="24" height="20" rx="4" fill="#0284c7" />
  <text x="164" y="116" text-anchor="middle" fill="#ffffff" font-weight="800" font-size="10">2</text>
  <text x="185" y="116" class="step-text">Read &amp; Strictly Parse Active JSON Policy Document</text>

  <path d="M 440 129 L 440 143" fill="none" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arr-std)" />

  <!-- Step 3 -->
  <rect x="140" y="145" width="600" height="34" rx="6" class="box-step" />
  <rect x="152" y="152" width="24" height="20" rx="4" fill="#0284c7" />
  <text x="164" y="166" text-anchor="middle" fill="#ffffff" font-weight="800" font-size="10">3</text>
  <text x="185" y="166" class="step-text">Merge New Derived Rule &amp; Rerun Hard Veto Validation</text>

  <path d="M 440 179 L 440 193" fill="none" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arr-std)" />

  <!-- Step 4 -->
  <rect x="140" y="195" width="600" height="34" rx="6" class="box-step" />
  <rect x="152" y="202" width="24" height="20" rx="4" fill="#0284c7" />
  <text x="164" y="216" text-anchor="middle" fill="#ffffff" font-weight="800" font-size="10">4</text>
  <text x="185" y="216" class="step-text">Write to Sibling Temp File (.pi/sandbox-rules.json.tmp.PID.TIME)</text>

  <path d="M 440 229 L 440 243" fill="none" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arr-std)" />

  <!-- Step 5 -->
  <rect x="140" y="245" width="600" height="34" rx="6" class="box-step" />
  <rect x="152" y="252" width="24" height="20" rx="4" fill="#0284c7" />
  <text x="164" y="266" text-anchor="middle" fill="#ffffff" font-weight="800" font-size="10">5</text>
  <text x="185" y="266" class="step-text">fsync() Temp File Descriptor -&gt; Close Descriptor</text>

  <path d="M 440 279 L 440 293" fill="none" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arr-std)" />

  <!-- Step 6 -->
  <rect x="140" y="295" width="600" height="34" rx="6" class="box-step" stroke="#10b981" />
  <rect x="152" y="302" width="24" height="20" rx="4" fill="#059669" />
  <text x="164" y="316" text-anchor="middle" fill="#ffffff" font-weight="800" font-size="10">6</text>
  <text x="185" y="316" class="step-text">fs.renameSync() Temp File to Target JSON &amp; Release Lock</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="100%" height="100%" style="font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <style>
      .text-title { fill: #0f172a; font-weight: 800; }
      .box-step { fill: #f8fafc; stroke: #0284c7; stroke-width: 1.5; }
      .step-num { fill: #0284c7; font-weight: 800; font-size: 11px; }
      .step-title { fill: #0f172a; font-weight: 700; font-size: 12px; }
      .step-sub { fill: #475569; font-size: 11px; }

      @media (prefers-color-scheme: dark) {
        .text-title { fill: #f8fafc; }
        .box-step { fill: #1e293b; stroke: #38bdf8; }
        .step-num { fill: #38bdf8; }
        .step-title { fill: #f8fafc; }
        .step-sub { fill: #cbd5e1; }
      }
    </style>
    <marker id="arr-std" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
  </defs>

  <text x="440" y="28" text-anchor="middle" class="text-title" font-size="17">/sandbox policy check Simulation Pipeline</text>

  <!-- Step 1 -->
  <rect x="40" y="45" width="800" height="42" rx="6" class="box-step" />
  <rect x="52" y="55" width="24" height="22" rx="4" fill="#0284c7" />
  <text x="64" y="70" text-anchor="middle" fill="#ffffff" font-weight="800" font-size="10">1</text>
  <text x="86" y="70" class="step-title">AST Decomposition Engine</text>
  <text x="820" y="70" text-anchor="end" class="step-sub">Extracts subcommands, tokens, wrappers, redirections</text>

  <path d="M 440 87 L 440 101" fill="none" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arr-std)" />

  <!-- Step 2 -->
  <rect x="40" y="103" width="800" height="42" rx="6" class="box-step" />
  <rect x="52" y="113" width="24" height="22" rx="4" fill="#0284c7" />
  <text x="64" y="128" text-anchor="middle" fill="#ffffff" font-weight="800" font-size="10">2</text>
  <text x="86" y="128" class="step-title">Tier 1 Policy Evaluator</text>
  <text x="820" y="128" text-anchor="end" class="step-sub">Evaluates hard vetoes, built-in rules, global/project rules</text>

  <path d="M 440 145 L 440 159" fill="none" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arr-std)" />

  <!-- Step 3 -->
  <rect x="40" y="161" width="800" height="42" rx="6" class="box-step" />
  <rect x="52" y="171" width="24" height="22" rx="4" fill="#0284c7" />
  <text x="64" y="186" text-anchor="middle" fill="#ffffff" font-weight="800" font-size="10">3</text>
  <text x="86" y="186" class="step-title">Tier 2 Classifier Route Simulator</text>
  <text x="820" y="186" text-anchor="end" class="step-sub">Determines if LLM review would be triggered</text>

  <path d="M 440 203 L 440 217" fill="none" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arr-std)" />

  <!-- Step 4 -->
  <rect x="40" y="219" width="800" height="42" rx="6" class="box-step" />
  <rect x="52" y="229" width="24" height="22" rx="4" fill="#0284c7" />
  <text x="64" y="244" text-anchor="middle" fill="#ffffff" font-weight="800" font-size="10">4</text>
  <text x="86" y="244" class="step-title">Tier 3 Mount Plan Previewer</text>
  <text x="820" y="244" text-anchor="end" class="step-sub">Simulates workspace binds, ephemeral caches, network profile</text>

  <path d="M 440 261 L 440 275" fill="none" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arr-std)" />

  <!-- Step 5 -->
  <rect x="40" y="277" width="800" height="42" rx="6" class="box-step" stroke="#10b981" />
  <rect x="52" y="287" width="24" height="22" rx="4" fill="#059669" />
  <text x="64" y="302" text-anchor="middle" fill="#ffffff" font-weight="800" font-size="10">5</text>
  <text x="86" y="302" class="step-title">Formatted Inspection Report Display</text>
  <text x="820" y="302" text-anchor="end" class="step-sub">Prints dry-run report. No execution, no permit created.</text>
</svg>